name: Windows

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        include:
          - { visual_studio: "Visual Studio 16 2019", python-version: "3.10" }
          - { visual_studio: "Visual Studio 16 2019", python-version: "3.11" }
          - { visual_studio: "Visual Studio 16 2019", python-version: "3.12" }

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install CUDA
      uses: Jimver/cuda-toolkit@v0.2.14
      id: cuda-toolkit
      with:
        cuda: '11.7.0'
        method: 'network'
    - name: nvcc check
      shell: powershell
      run: |
        nvcc -V
        ls $env:CUDA_PATH
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      shell: bash
      env:
        SKBUILD_CMAKE_DEFINE: "BUILD_GLEW=ON;BUILD_GLFW=ON;BUILD_PNG=ON;BUILD_JSONCPP=ON"
        SKBUILD_CMAKE_ARGS: "-G${{ matrix.visual_studio }};-Ax64"
      run: uv build --wheel
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: cupoch-wheel-win-py${{ matrix.python-version }}
        path: dist/*.whl
