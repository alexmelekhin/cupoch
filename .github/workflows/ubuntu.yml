name: Ubuntu

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install CUDA
      uses: Jimver/cuda-toolkit@v0.2.35
      id: cuda-toolkit
      with:
        cuda: '12.9.0'
        method: 'network'
    - name: Install system dependencies
      run: ./scripts/actions/install_deps_ubuntu.sh
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      env:
        SKBUILD_CMAKE_DEFINE: "BUILD_GLEW=ON;BUILD_GLFW=ON;BUILD_PNG=ON;BUILD_JSONCPP=ON"
        CMAKE_GENERATOR: "Unix Makefiles"
      run: uv build --wheel
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: cupoch-wheel-linux-py${{ matrix.python-version }}
        path: dist/*.whl
